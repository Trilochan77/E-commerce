server:
  port: 8084

spring:
  application:
    name: recommendation-service
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/ecom}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

recommendation:
  default-limit: 10
  max-activity-lookback: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
