server:
  port: 8084

spring:
  application:
    name: recommendation-service
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:27017/ecom}

eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

recommendation:
  default-limit: 10
  max-activity-lookback: 200

management:
  endpoints:
    web:
      exposure:
        include: health,info
