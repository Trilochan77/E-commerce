server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: lb://user-service
              predicates: [ Path=/api/users/**, Path=/api/auth/** ]
            - id: product-service
              uri: lb://product-service
              predicates: [ Path=/api/products/**, Path=/api/categories/** ]
            - id: search-service
              uri: lb://search-service
              predicates: [ Path=/api/search/** ]
            - id: recommendation-service
              uri: lb://recommendation-service
              predicates: [ Path=/api/recommendations/**, Path=/api/activity/** ]
            - id: cart-service
              uri: lb://cart-service
              predicates: [ Path=/api/cart/** ]
            - id: order-service
              uri: lb://order-service
              predicates: [ Path=/api/orders/** ]
            - id: return-reward-service
              uri: lb://return-reward-service
              predicates: [ Path=/api/returns/**, Path=/api/wallet/**, Path=/api/rewards/** ]
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:4200"
            allowed-methods: "*"
            allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-min-32-chars-long}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
