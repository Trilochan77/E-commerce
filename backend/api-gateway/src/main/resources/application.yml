server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/users, /api/users/**, /api/auth, /api/auth/**
        - id: product-service
          uri: lb://product-service
          predicates:
            - Path=/api/products, /api/products/**, /api/categories, /api/categories/**
        - id: search-service
          uri: lb://search-service
          predicates:
            - Path=/api/search, /api/search/**
        - id: recommendation-service
          uri: lb://recommendation-service
          predicates:
            - Path=/api/recommendations, /api/recommendations/**, /api/activity, /api/activity/**
        - id: cart-service
          uri: lb://cart-service
          predicates:
            - Path=/api/cart, /api/cart/**
        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/orders, /api/orders/**
        - id: return-reward-service
          uri: lb://return-reward-service
          predicates:
            - Path=/api/returns, /api/returns/**, /api/wallet, /api/wallet/**, /api/rewards, /api/rewards/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins: "http://localhost:4200"
            allowed-methods: "*"
            allowed-headers: "*"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: ${JWT_SECRET:change-me-dev-secret-min-32-chars-long}

management:
  endpoint:
    gateway:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,gateway
