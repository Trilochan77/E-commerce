# Phase 0 — Infra + discovery + gateway.
# Full microservices (user, product, search, ...) are added in Phase 1-3
# as `build:` entries below (commented). `docker compose up -d mongo elasticsearch`
# works TODAY without any Java build; eureka/gateway build once Maven is installed.
name: ecom-recommendation

services:
  mongo:
    image: mongo:7
    container_name: ecom-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecom-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend/eureka-server
    container_name: ecom-eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend/api-gateway
    container_name: ecom-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret-min-32-chars-long}
    depends_on:
      - eureka-server
    restart: unless-stopped

  # ---- Phase 1+ services (uncomment as each is scaffolded) ----
