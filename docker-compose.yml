# Phase 0 — Infra + discovery + gateway.
# Full microservices (user, product, search, ...) are added in Phase 1-3
# as `build:` entries below (commented). `docker compose up -d mongo elasticsearch`
# works TODAY without any Java build; eureka/gateway build once Maven is installed.
name: ecom-recommendation

services:
  mongo:
    image: mongo:7
    container_name: ecom-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: ecom-es
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  eureka-server:
    build:
      context: ./backend
      dockerfile: ./eureka-server/Dockerfile
    container_name: ecom-eureka
    ports:
      - "8761:8761"
    environment:
      - SERVER_PORT=8761
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: ./backend
      dockerfile: ./api-gateway/Dockerfile
    container_name: ecom-gateway
    ports:
      - "8080:8080"
    environment:
      - SERVER_PORT=8080
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret-min-32-chars-long}
    depends_on:
      - eureka-server
    restart: unless-stopped

  # ---- Phase 1 services ----
  user-service:
    build:
      context: ./backend
      dockerfile: ./user-service/Dockerfile
    container_name: ecom-user
    ports: ["8081:8081"]
    environment:
      - SERVER_PORT=8081
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - JWT_SECRET=${JWT_SECRET:-change-me-dev-secret-min-32-chars-long}
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  product-service:
    build:
      context: ./backend
      dockerfile: ./product-service/Dockerfile
    container_name: ecom-product
    ports: ["8082:8082"]
    environment:
      - SERVER_PORT=8082
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  search-service:
    build:
      context: ./backend
      dockerfile: ./search-service/Dockerfile
    container_name: ecom-search
    ports: ["8083:8083"]
    environment:
      - SERVER_PORT=8083
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - ELASTICSEARCH_URIS=http://elasticsearch:9200
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - RECOMMENDATION_URL=http://recommendation-service:8084
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  cart-service:
    build:
      context: ./backend
      dockerfile: ./cart-service/Dockerfile
    container_name: ecom-cart
    ports: ["8085:8085"]
    environment:
      - SERVER_PORT=8085
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - PRODUCT_SERVICE_URL=http://product-service:8082
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  order-service:
    build:
      context: ./backend
      dockerfile: ./order-service/Dockerfile
    container_name: ecom-order
    ports: ["8086:8086"]
    environment:
      - SERVER_PORT=8086
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - RECOMMENDATION_URL=http://recommendation-service:8084
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  # ---- Phase 2 service ----
  recommendation-service:
    build:
      context: ./backend
      dockerfile: ./recommendation-service/Dockerfile
    container_name: ecom-recommendation
    ports: ["8084:8084"]
    environment:
      - SERVER_PORT=8084
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

  # ---- Phase 3 service ----
  return-reward-service:
    build:
      context: ./backend
      dockerfile: ./return-reward-service/Dockerfile
    container_name: ecom-reward
    ports: ["8087:8087"]
    environment:
      - SERVER_PORT=8087
      - SPRING_DATA_MONGODB_URI=mongodb://mongo:27017/ecom
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      mongo:
        condition: service_healthy
      eureka-server:
        condition: service_started
    restart: unless-stopped

volumes:
  mongo-data:
  es-data:
